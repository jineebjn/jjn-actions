name: Recon Workflow

on:
  push:
    paths:
      - 'targets.txt'  # Only run when this file changes

# Least privilege for the built-in token (the push below uses MY_PAT, unaffected).
permissions:
  contents: write

# Serialize runs so queued scans don't race each other on git push.
concurrency:
  group: recon
  cancel-in-progress: false

jobs:
  recon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3
          # sudo apt-get install -y nmap
          go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Prepare and validate target
        run: |
          # Strip surrounding whitespace / stray CR (targets.txt may be CRLF).
          target=$(head -1 targets.txt | tr -d '[:space:]')
          # Reject anything that is not a plain domain name. This value is used
          # in shell commands and file paths, so validation prevents injection.
          if ! printf '%s' "$target" | grep -qE '^([a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?\.)+(xn--[a-zA-Z0-9-]+|[a-zA-Z]{2,})$'; then
            echo "::error::Invalid target domain: '$target'"
            exit 1
          fi
          echo "target=$target" >> "$GITHUB_ENV"
          mkdir -p "output/$target"

      # - name: Run Nmap
      #   run: |
      #     nmap -p- -sS -sV "$target" -v -oN output/$target/nmap.txt

      - name: Run Subfinder and Deduplicate
        run: |
          subfinder -d "$target" -silent > "output/$target/subs.txt"
          sort -u "output/$target/subs.txt" > "output/$target/subs_uniq.txt"

      - name: Probe live hosts (httpx)
        run: |
          # JSON lines so the viewer gets real status codes and titles.
          # The viewer still renders older plain-URL live.txt files too.
          httpx -silent -json -l "output/$target/subs_uniq.txt" \
            > "output/$target/live.txt" || true

      - name: Run subdomain takeover
        run: |
          python3 takeover.py -l "output/$target/subs_uniq.txt" -v -o "output/$target/takeover.txt"

      - name: Commit Results
        run: |
          git config --local user.email "jineebjn@gmail.com"
          git config --local user.name "jineebjn"
          git add output/
          git commit -m "Automated recon result for $target" || echo "Nothing to commit"
        continue-on-error: true

      - name: Push to Repo
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.MY_PAT }}
          branch: main
