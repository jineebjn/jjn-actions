name: Recon Workflow

on:
  push:
    paths:
      - 'targets.txt'  # Only run when this file changes

# Least privilege for the built-in token (the push below uses MY_PAT, unaffected).
permissions:
  contents: write

# Serialize runs so queued scans don't race each other on git push.
concurrency:
  group: recon
  cancel-in-progress: false

jobs:
  recon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Add Go bin to PATH
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Cache recon tools
        id: tools-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          # Bump the vN suffix to force a rebuild and pull newer tool versions.
          key: recon-tools-v1-${{ runner.os }}

      - name: Install Tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          # python3 is preinstalled on ubuntu-latest, so nothing to apt-get here.
          go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install -v github.com/projectdiscovery/dnsx/cmd/dnsx@latest
          go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest

      - name: Prepare and validate target
        run: |
          # Strip surrounding whitespace / stray CR (targets.txt may be CRLF).
          target=$(head -1 targets.txt | tr -d '[:space:]')
          # Reject anything that is not a plain domain name. This value is used
          # in shell commands and file paths, so validation prevents injection.
          if ! printf '%s' "$target" | grep -qE '^([a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?\.)+(xn--[a-zA-Z0-9-]+|[a-zA-Z]{2,})$'; then
            echo "::error::Invalid target domain: '$target'"
            exit 1
          fi
          echo "target=$target" >> "$GITHUB_ENV"
          mkdir -p "output/$target"

      # - name: Run Nmap
      #   run: |
      #     nmap -p- -sS -sV "$target" -v -oN output/$target/nmap.txt

      - name: Run Subfinder and Deduplicate
        run: |
          # -all uses every passive source that needs no API key for more coverage.
          subfinder -d "$target" -all -silent > "output/$target/subs.txt"
          sort -u "output/$target/subs.txt" > "output/$target/subs_uniq.txt"

      - name: Resolve DNS (dnsx)
        run: |
          # Keep only names that actually resolve; this trims dead hosts before
          # httpx, so probing does less work (lighter on Action minutes).
          dnsx -silent -l "output/$target/subs_uniq.txt" > "output/$target/resolved.txt" || true

      - name: Probe live hosts (httpx)
        run: |
          # JSON lines with real status, title, tech, IP, CDN, ASN and redirect.
          # Fields are read from requests httpx already makes (no extra probes).
          # Falls back to the full list if resolution produced nothing.
          input="output/$target/resolved.txt"
          [ -s "$input" ] || input="output/$target/subs_uniq.txt"
          httpx -silent -json \
            -status-code -title -tech-detect -ip -cname -cdn -asn -location -content-length \
            -rl 150 -retries 2 \
            -l "$input" \
            > "output/$target/live.txt" || true

      - name: Run subdomain takeover
        run: |
          python3 takeover.py -l "output/$target/subs_uniq.txt" -v -o "output/$target/takeover.txt"

      - name: Write metadata and snapshot
        run: |
          dir="output/$target"
          ts=$(date -u +%Y-%m-%dT%H-%M-%SZ)

          count() { if [ -f "$1" ]; then grep -c '' "$1" || true; else echo 0; fi; }
          subs=$(count "$dir/subs_uniq.txt")
          live=$(count "$dir/live.txt")
          if [ -f "$dir/takeover.txt" ]; then
            takeover=$(grep -c '^Domain' "$dir/takeover.txt" || true)
          else
            takeover=0
          fi

          jq -n --arg d "$target" --argjson s "${subs:-0}" --argjson l "${live:-0}" --argjson t "${takeover:-0}" \
            '{domain:$d, subs:$s, live:$l, takeover:$t}' > "$dir/summary.json"
          jq -n --arg d "$target" --arg ts "$ts" \
            '{domain:$d, scanned_at:$ts, tools:{subfinder:"latest", dnsx:"latest", httpx:"latest", takeover:"takeover.py"}}' \
            > "$dir/meta.json"

          # Timestamped snapshot for history and diffing.
          snap="$dir/history/$ts"
          mkdir -p "$snap"
          cp "$dir"/subs.txt "$dir"/subs_uniq.txt "$dir"/resolved.txt "$dir"/live.txt "$dir"/takeover.txt \
             "$dir"/summary.json "$dir"/meta.json "$snap"/ 2>/dev/null || true

          # Maintain history.json (newest first), keeping the 10 most recent.
          hist="$dir/history.json"
          if [ -f "$hist" ]; then
            jq -c --arg ts "$ts" '([$ts] + .) | unique | reverse | .[0:10]' "$hist" > "$hist.tmp"
          else
            jq -cn --arg ts "$ts" '[$ts]' > "$hist.tmp"
          fi
          mv "$hist.tmp" "$hist"

          # Prune snapshot directories beyond the 10 most recent.
          ls -1d "$dir"/history/*/ 2>/dev/null | sort | head -n -10 | while read -r old; do
            rm -rf "$old"
          done

      - name: Commit Results
        run: |
          git config --local user.email "jineebjn@gmail.com"
          git config --local user.name "jineebjn"
          git add output/
          git commit -m "Automated recon result for $target" || echo "Nothing to commit"
        continue-on-error: true

      - name: Push to Repo
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.MY_PAT }}
          branch: main
